# Restart leigod after changing these values. Do not use shell expressions.
# Existing unowned wlan0 interfaces, including physical Wi-Fi, are preserved.
#
# DEVICE_IP=auto: create an identity-only dummy wlan0 using the selected LAN
# interface's address (/32 by default). Discovery arrives on the real LAN.
# DEVICE_IP=none: create a dummy identity without an IPv4 address.
# DEVICE_IP=<IPv4>: use a macvlan with a separate address reserved on your LAN.
# Static addresses must not conflict with DHCP leases or the parent address.
# macvlan is intended for wired Ethernet; Wi-Fi/VPN parents may not support it.
#
# DEVICE_PREFIX=auto: /32 for auto IP, parent prefix for a static IP.
# An explicit prefix must be in 1..32. No connected main-table route is added.
# DEVICE_PARENT=auto: select the interface used by the default IPv4 route.
# Set a LAN interface explicitly on VPN/multi-interface hosts. The firewall
# helper uses the same selection. IPv4 route lookup does not send a probe.
DEVICE_IP=auto
DEVICE_PREFIX=auto
DEVICE_PARENT=auto
